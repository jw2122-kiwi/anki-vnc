[supervisord]
nodaemon=true
user=root
environment=DISPLAY=":99",LANG="C.UTF-8",LC_ALL="C.UTF-8",QTWEBENGINE_CHROMIUM_FLAGS="--no-sandbox --disable-gpu"

[unix_http_server]
file=/var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1600x900x24
priority=10
autorestart=true

[program:openbox]
command=/usr/bin/openbox-session
priority=20
autorestart=true

[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -forever -shared -nopw -rfbport 5900
priority=30
autorestart=true

[program:novnc]
command=/usr/share/novnc/utils/novnc_proxy --vnc localhost:5900 --listen 8780
priority=40
autorestart=true

[program:anki]
command=/usr/local/bin/anki-launcher
priority=50
autorestart=true
startsecs=10
